name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check that the tag matches the extension version
        run: |
          VERSION=$(python build_rbz.py --version)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match extension version v$VERSION"
            exit 1
          fi

      - name: Build package
        run: python build_rbz.py

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rbz
          generate_release_notes: true
